<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Skeleton Layout</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#ffffff;
      font-family:Arial, sans-serif;
      padding:20px;
    }

    /* GRID */
    .videos{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
      margin-bottom: 40px;
    }

    /* CARD */
    .card{
      width:100%;
    }

    /* SKELETON COLOR */
    .skeleton{
      background:#f2f2f2;
      border-radius:8px;
    }

    /* THUMBNAIL */
    .thumbnail{
      width:100%;
      height:180px;
      margin-bottom:12px;
    }

    /* VIDEO INFO */
    .info{
      display:flex;
      gap:12px;
    }

    /* CHANNEL ICON */
    .avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      flex-shrink:0;
    }

    /* TEXT AREA */
    .text{
      flex:1;
    }

    .title{
      width:90%;
      height:14px;
      margin-bottom:10px;
    }

    .subtitle{
      width:60%;
      height:12px;
      margin-bottom:8px;
    }

    .views{
      width:40%;
      height:12px;
    }
  </style>
</head>
<body>

  <div class="videos">

    <!-- CARD 1 -->
    <div class="card">
      <div class="thumbnail skeleton"></div>

      <div class="info">
        <div class="avatar skeleton"></div>

        <div class="text">
          <div class="title skeleton"></div>
          <div class="subtitle skeleton"></div>
          <div class="views skeleton"></div>
        </div>
      </div>
    </div>
